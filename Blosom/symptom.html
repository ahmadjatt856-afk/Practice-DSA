<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Tracker — Blossom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html">Cycle Tracker</a>
            <a href="symptom-tracker.html" class="active">Symptoms</a>
            <a href="water-tracker.html">Water</a>
            <a href="reminders.html">Reminders</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>🩺 Symptom Tracker</h1>
            <p>Log daily symptoms and track patterns</p>
        </div>

        <div class="card-panel">
            <h3>Log a new symptom today</h3>
            <form id="symptomLogForm">
                <div class="form-group">
                    <label for="symptomSelect">Symptom</label>
                    <select id="symptomSelect" class="form-control-custom" required>
                        <option value="">Select...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="symptomSeverity">Severity (1 = very mild, 5 = very severe)</label>
                    <input type="range" id="symptomSeverity" min="1" max="5" value="3" oninput="sevValue.innerText = this.value">
                    <span id="sevValue" style="margin-left:10px;">3</span>/5
                </div>
                <button type="submit" class="btn-submit">Save symptom</button>
            </form>
            <div id="symptomLogMsg" style="margin-top:16px;"></div>
        </div>

        <div class="card-panel">
            <h3>Symptom history (last 10)</h3>
            <table class="data-table" id="symptomTable">
                <thead>
                    <tr><th>Date</th><th>Symptom</th><th>Severity</th><th>Bar</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
