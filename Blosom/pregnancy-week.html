<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Weeks — Blossom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html">Cycle Tracker</a>
            <a href="pregnancy-test.html">Pregnancy Test</a>
            <a href="pregnancy-weeks.html" class="active">Weeks → Months</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>📆 Pregnancy Weeks → Months</h1>
            <p>Convert weeks to months and trimester</p>
        </div>

        <div class="card-panel">
            <form id="weeksForm">
                <div class="form-group">
                    <label for="weeksInput">Number of pregnancy weeks</label>
                    <input type="number" id="weeksInput" class="form-control-custom" min="0" step="0.1" required>
                </div>
                <button type="submit" class="btn-submit">Convert</button>
            </form>
            <div id="weeksResults" class="results-box" style="display:none;"></div>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
