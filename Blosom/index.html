<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-page="auth">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>🌸 Blossom</h1>
            <p style="color:#9b5bb5;">Menstrual Health Tracker</p>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Login</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form">
                <div id="loginMessage" class="form-message" style="display:none;margin-bottom:12px;"></div>
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-control-custom" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control-custom" required>
                </div>
                <button type="submit" class="btn-submit" style="width:100%;">Login</button>
            </form>

            <form id="signupForm" class="auth-form hidden">
                <div id="signupMessage" class="form-message" style="display:none;margin-bottom:12px;"></div>
                <div class="form-group">
                    <label for="signupUsername">New username</label>
                    <input type="text" id="signupUsername" class="form-control-custom" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">New password</label>
                    <input type="password" id="signupPassword" class="form-control-custom" required>
                </div>
                <button type="submit" class="btn-submit" style="width:100%;">Create account</button>
            </form>

            <div id="apiStatus" style="display:none;margin-top:20px;padding:12px;border-radius:12px;font-size:13px;"></div>
            <p style="margin-top:16px;font-size:13px;color:#9b5bb5;">
                <!-- Start <strong>BlossomTracker.Api</strong> first, then log in. -->
            </p>
        </div>
    </div>

    <script src="css/js/app.js"></script>
</body>
</html>
