<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html" class="active">Cycle Tracker</a>
            <a href="symptom-tracker.html">Symptoms</a>
            <a href="water-tracker.html">Water</a>
            <a href="reminders.html">Reminders</a>
            <a href="exercise-mood.html">Exercise & Mood</a>

            <a href="about.html">About</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>📅 Period & Ovulation Calculator</h1>
            <p>Track your cycle and get accurate predictions</p>
        </div>

        <div class="card-panel">
            <form id="cycleForm">
                <div class="form-group">
                    <label for="lastPeriod">Last period start date</label>
                    <input type="date" id="lastPeriod" class="form-control-custom" required>
                </div>
                <div class="form-group">
                    <label for="cycleLength">Average cycle length (days, 20–45)</label>
                    <input type="number" id="cycleLength" class="form-control-custom" min="20" max="45" value="28" required>
                </div>
                <div class="form-group">
                    <label for="periodLength">Average period length (days, 1–10)</label>
                    <input type="number" id="periodLength" class="form-control-custom" min="1" max="10" value="5" required>
                </div>
                <button type="submit" class="btn-submit">Calculate & Save</button>
            </form>
            <div id="cycleResults" class="results-box" style="display:none;"></div>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
