<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker — Blossom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html">Cycle Tracker</a>
            <a href="symptom-tracker.html">Symptoms</a>
            <a href="water-tracker.html" class="active">Water</a>
            <a href="reminders.html">Reminders</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>💧 Water Intake Tracker</h1>
            <p>Stay hydrated for better health</p>
        </div>

        <div class="card-panel">
            <h3>Log today's water intake</h3>
            <p style="color:#9b5bb5;">Recommended daily goal: 8 glasses (2 litres)</p>
            <form id="waterForm">
                <div class="form-group">
                    <label for="waterGlasses">Glasses consumed today</label>
                    <input type="number" id="waterGlasses" class="form-control-custom" min="0" max="30" required>
                </div>
                <div class="form-group">
                    <label for="waterGoal">Daily goal (glasses, default 8)</label>
                    <input type="number" id="waterGoal" class="form-control-custom" min="1" value="8">
                </div>
                <button type="submit" class="btn-submit">Save intake</button>
            </form>
            <div id="waterMsg" style="margin-top:16px;"></div>
        </div>

        <div class="card-panel">
            <h3>Water history (last 7 days)</h3>
            <table class="data-table" id="waterTable">
                <thead><tr><th>Date</th><th>Glasses</th><th>Goal</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
