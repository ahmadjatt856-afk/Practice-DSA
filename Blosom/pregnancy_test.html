<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Test Calculator — Blossom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html">Cycle Tracker</a>
            <a href="pregnancy-test.html" class="active">Pregnancy Test</a>
            <a href="pregnancy-weeks.html">Weeks → Months</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>🤰 Pregnancy Test Date Calculator</h1>
            <p>Find the best day to take a pregnancy test</p>
        </div>

        <div class="card-panel">
            <form id="pregnancyTestForm">
                <div class="form-group">
                    <label for="ptLastPeriod">Last period start date</label>
                    <input type="date" id="ptLastPeriod" class="form-control-custom" required>
                </div>
                <div class="form-group">
                    <label for="ptCycleLength">Average cycle length (20–45 days)</label>
                    <input type="number" id="ptCycleLength" class="form-control-custom" min="20" max="45" value="28" required>
                </div>
                <button type="submit" class="btn-submit">Calculate</button>
            </form>
            <div id="ptResults" class="results-box" style="display:none;"></div>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
