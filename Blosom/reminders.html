<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders — Blossom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-require-auth="true">
    <nav class="top-bar">
        <div class="logo">🌙 Blossom</div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="cycle-tracker.html">Cycle Tracker</a>
            <a href="symptom-tracker.html">Symptoms</a>
            <a href="water-tracker.html">Water</a>
            <a href="reminders.html" class="active">Reminders</a>
            <a href="logout.html" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-title">
            <h1>🔔 Reminders & Notifications</h1>
            <p>Never miss important health events</p>
        </div>

        <div class="card-panel">
            <h3>Upcoming reminders</h3>
            <div id="reminderList"></div>
        </div>

        <div class="card-panel">
            <h3>Set a new reminder</h3>
            <form id="reminderSetForm">
                <div class="form-group">
                    <label for="reminderType">Reminder type</label>
                    <select id="reminderType" class="form-control-custom" required>
                        <option value="Next Period">Next Period</option>
                        <option value="Ovulation Day">Ovulation Day</option>
                        <option value="Take Medicine">Take Medicine</option>
                        <option value="Drink Water">Drink Water</option>
                        <option value="Doctor Appointment">Doctor Appointment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reminderDate">Reminder date</label>
                    <input type="date" id="reminderDate" class="form-control-custom" required>
                </div>
                <button type="submit" class="btn-submit">Set reminder</button>
            </form>
            <div id="reminderSetMsg" style="margin-top:12px;"></div>
        </div>

        <div class="card-panel">
            <h3>Mark reminder as done</h3>
            <form id="reminderMarkForm">
                <div class="form-group">
                    <label for="reminderMarkType">Reminder type</label>
                    <select id="reminderMarkType" class="form-control-custom" required>
                        <option value="Next Period">Next Period</option>
                        <option value="Ovulation Day">Ovulation Day</option>
                        <option value="Take Medicine">Take Medicine</option>
                        <option value="Drink Water">Drink Water</option>
                        <option value="Doctor Appointment">Doctor Appointment</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Mark done</button>
            </form>
            <div id="reminderMarkMsg" style="margin-top:12px;"></div>
        </div>
    </main>

    <script src="css/js/app.js"></script>
</body>
</html>
